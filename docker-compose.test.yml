version: '3.8'

services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs-dev-local
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=https://xtranscendence.local
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx-dev-local
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.test.conf:/etc/nginx/nginx.conf:ro
      - ./data/ssl:/etc/letsencrypt:rw
    depends_on:
      - nextjs
    networks:
      - app-network

networks:
  app-network:
    driver: bridge